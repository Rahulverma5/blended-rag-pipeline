# Fill this in before you submit -- our evaluator runs these commands
# EXACTLY as written, in this order, from a fresh checkout of your fork.
# Keep every command non-interactive (no prompts) and idempotent.

setup_commands:
  - "pip install -r requirements.txt"
  - "python src/main.py download"

run_commands:
  - "python src/main.py index"
  - "python src/main.py evaluate --configs default"
  - "python src/main.py search \"Consider the Acquisition Agreement between Parent 'BridgeBio Pharma, Inc.' and Target 'Eidos Therapeutics, Inc.'; Where is the No-Shop Clause\" -k 3"

test_commands:
  - "pytest -q"

notes: "CPU only, no GPU or API key. `download` fetches two ONNX models (~650 MB, public Hugging Face). The LegalBench-RAG-mini corpus and the default config's chunk vectors are committed (precomputed on a Kaggle T4, see kaggle/README.md), so no data download or chunk encoding is needed. `evaluate` encodes the 776 queries on CPU (~1-2 min) and prints the results table. Total about 5-10 minutes. Full ablation: `python src/main.py evaluate --configs core` (needs the other vectors from kaggle/encode.py)."
