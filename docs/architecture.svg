<text x="810.0" y="351.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Dense scorer</text>
<text x="810.0" y="368.0" font-size="11" text-anchor="middle" fill="#444">bge-small cosine</text>
<text x="810.0" y="382.0" font-size="11" text-anchor="middle" fill="#444">(query encoded on CPU, ONNX)</text>
<rect x="710" y="410" width="200" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="810.0" y="436.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">SPLADE scorer</text>
<text x="810.0" y="453.0" font-size="11" text-anchor="middle" fill="#444">learned term weights</text>
<text x="810.0" y="467.0" font-size="11" text-anchor="middle" fill="#444">sparse dot product</text>
<rect x="965" y="295" width="190" height="80" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
