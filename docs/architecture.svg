<text x="115.0" y="101.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Contracts</text>
<text x="115.0" y="118.0" font-size="11" text-anchor="middle" fill="#444">LegalBench-RAG-mini</text>
<text x="115.0" y="132.0" font-size="11" text-anchor="middle" fill="#444">72 docs · 8.7M chars</text>
<rect x="250" y="45" width="190" height="70" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="345.0" y="71.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Heading-aware chunker</text>
<text x="345.0" y="88.0" font-size="11" text-anchor="middle" fill="#444">≤500 chars, no overlap</text>
<text x="345.0" y="102.0" font-size="11" text-anchor="middle" fill="#444">exact char offsets</text>
<rect x="250" y="160" width="190" height="70" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="345.0" y="186.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Router index</text>
<text x="345.0" y="203.0" font-size="11" text-anchor="middle" fill="#444">BM25 over contract</text>
<text x="345.0" y="217.0" font-size="11" text-anchor="middle" fill="#444">name + first 2k chars</text>
