<text x="810.0" y="69.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Encode chunks</text>
<text x="810.0" y="86.0" font-size="11" text-anchor="middle" fill="#444">bge-small (dense)</text>
<text x="810.0" y="100.0" font-size="11" text-anchor="middle" fill="#444">SPLADE++ (sparse)</text>
<text x="810.0" y="114.0" font-size="11" text-anchor="middle" fill="#444">Kaggle T4, ~6 min · 26 MB</text>
