<text x="1060.0" y="350.0" font-size="11" text-anchor="middle" fill="#444">Σ 1 / (60 + rank)</text>
<rect x="965" y="400" width="190" height="100" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="1060.0" y="434.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Top-k cited spans</text>
<text x="1060.0" y="451.0" font-size="11" text-anchor="middle" fill="#444">doc · char offsets · section</text>
<text x="1060.0" y="465.0" font-size="11" text-anchor="middle" fill="#444">R@64 81.9 · P@1 13.5</text>
<text x="1060.0" y="479.0" font-size="11" text-anchor="middle" fill="#444">optional: ask --llm claude</text>
<rect x="560" y="507" width="370" height="38" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
