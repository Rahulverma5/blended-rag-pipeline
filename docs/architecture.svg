<text x="250" y="478" font-size="11" font-style="italic" fill="#9673a6">BM25 + IBM templates do routing only:</text>
<text x="250" y="492" font-size="11" font-style="italic" fill="#9673a6">removing BM25 from ranking gave +2.7 R@8</text>
