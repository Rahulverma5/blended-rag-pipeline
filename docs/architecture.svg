<text x="115.0" y="384.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Question</text>
<text x="115.0" y="401.0" font-size="11" text-anchor="middle" fill="#444">"Consider the merger</text>
<text x="115.0" y="415.0" font-size="11" text-anchor="middle" fill="#444">between X and Y; where</text>
<text x="115.0" y="429.0" font-size="11" text-anchor="middle" fill="#444">is the No-Shop clause?"</text>
<rect x="250" y="345" width="210" height="110" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="355.0" y="377.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">1 · Route: which contract?</text>
<text x="355.0" y="394.0" font-size="11" text-anchor="middle" fill="#444">max idf of name word in query</text>
<text x="355.0" y="408.0" font-size="11" text-anchor="middle" fill="#444">+ preamble BM25</text>
<text x="355.0" y="422.0" font-size="11" text-anchor="middle" fill="#444">top-1 correct 99.6%</text>
<text x="355.0" y="436.0" font-size="11" text-anchor="middle" fill="#444">keeps ≤3 close contracts</text>
